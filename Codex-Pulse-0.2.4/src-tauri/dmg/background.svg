<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="0.58" stop-color="#17232d"/>
      <stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientTransform="translate(122 270) rotate(-8) scale(270 225)">
      <stop stop-color="#25bfd6" stop-opacity="0.16"/>
