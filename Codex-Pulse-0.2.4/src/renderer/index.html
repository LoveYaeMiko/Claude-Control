<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Codex Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="header" id="drag-region">
      <span class="health-dot" id="health-dot" aria-hidden="true"></span>
      <div class="heading">
        <h1>Codex Pulse</h1>
        <p id="subtitle">正在读取本机会话…</p>
      </div>
      <span class="mode-badge" id="yolo-badge" hidden>YOLO</span>
      <button class="round-button" id="refresh-button" title="立即刷新" aria-label="立即刷新">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 11V5m0 6h-6"/></svg>
      </button>
      <button class="round-button" id="pin-button" title="固定窗口" aria-label="固定窗口" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M5 3h14"/><path d="M6 3v6l-2 3h16l-2-3V3"/></svg>
      </button>
      <button class="round-button" id="minimize-button" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <div class="menu-wrap">
        <button class="round-button" id="menu-button" aria-label="菜单">•••</button>
        <div class="menu" id="menu" hidden>
          <button id="yolo-toggle" class="mode-toggle" role="switch" aria-checked="false">
            <span class="menu-copy"><strong>YOLO 模式</strong><small>跳过审批与沙箱</small></span>
            <span class="switch" aria-hidden="true"></span>
          </button>
          <div class="menu-setting">
            <strong id="session-title-mode-label">会话显示</strong>
            <div class="menu-segmented" role="group" aria-labelledby="session-title-mode-label">
              <button type="button" data-session-title-mode="prompt" aria-pressed="true">最后提问</button>
              <button type="button" data-session-title-mode="title" aria-pressed="false">标题</button>
            </div>
          </div>
          <button id="display-settings-menu">显示设置…</button>
          <div class="menu-divider"></div>
          <button id="manage-remote-menu">管理远程服务器</button>
          <div class="menu-divider"></div>
          <button data-menu-action="hide">隐藏悬浮窗</button>
          <button data-menu-action="quit" class="danger">退出 Codex Pulse</button>
        </div>
      </div>
    </header>

    <div class="controls">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search-input" type="search" autocomplete="off" placeholder="搜索">
      </label>
      <nav class="tabs" aria-label="状态筛选">
        <button class="selected focus-tab" data-filter="focus">关注 <span id="count-focus">0</span></button>
        <button class="active-tab" data-filter="active">进行 <span id="count-active">0</span></button>
        <button class="completed-pending-tab" data-filter="completed_pending">新完成 <span id="count-completed_pending">0</span></button>
        <button class="failed-tab" data-filter="failed">失败 <span id="count-failed">0</span></button>
        <button data-filter="all">全部 <span id="count-all">0</span></button>
      </nav>
    </div>

    <main class="content" id="content">
      <div class="empty loading" id="empty-state">
        <div class="empty-icon">&gt;_</div>
        <strong>正在同步 Codex</strong>
        <span>首次读取可能需要几秒钟</span>
        <button class="empty-action" id="empty-action" hidden></button>
      </div>
      <div class="session-list" id="session-list"></div>
    </main>

    <div class="session-context-menu" id="session-context-menu" role="menu" hidden></div>

    <div class="modal-backdrop" id="remote-modal" hidden>
      <section class="remote-dialog" role="dialog" aria-modal="true" aria-labelledby="remote-dialog-title">
        <header>
          <div><strong id="remote-dialog-title">远程服务器</strong></div>
          <button id="remote-modal-close" aria-label="关闭">×</button>
        </header>
        <form id="remote-form">
          <input id="remote-host-input" autocomplete="off" spellcheck="false" placeholder="SSH 别名，例如 dev-server">
          <button type="submit">添加</button>
        </form>
        <p class="remote-form-error" id="remote-form-error" hidden></p>
        <div class="remote-list-heading"><span>已添加</span></div>
        <div class="remote-host-list" id="remote-host-list"></div>
        <div class="remote-list-heading"><span>从 ~/.ssh/config 发现</span><button id="reload-ssh-hosts">重新读取</button></div>
        <div class="discovered-host-list" id="discovered-host-list"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="rename-modal" hidden>
      <section class="rename-dialog" role="dialog" aria-modal="true" aria-labelledby="rename-dialog-title">
        <header>
          <strong id="rename-dialog-title">重命名会话</strong>
          <button type="button" id="rename-modal-close" aria-label="关闭">×</button>
        </header>
        <form id="rename-form">
          <input id="rename-input" type="text" required maxlength="100" autocomplete="off" aria-label="会话名称">
          <div class="rename-actions">
            <button type="button" id="rename-cancel">取消</button>
            <button type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="display-settings-modal" hidden>
      <section class="display-settings-dialog" role="dialog" aria-modal="true" aria-labelledby="display-settings-title">
        <header>
          <strong id="display-settings-title">显示设置</strong>
          <button type="button" id="display-settings-close" aria-label="关闭">×</button>
        </header>
        <form id="display-settings-form">
          <div class="display-settings-list">
            <div class="display-setting-row focus-total-row">
              <span>关注</span>
              <output id="focus-limit-total">8 条</output>
            </div>
            <label class="display-setting-row">
              <span>进行中</span>
              <span class="number-stepper">
                <button type="button" data-step="-1" aria-label="减少进行中数量">−</button>
                <input type="number" min="1" max="8" value="4" data-display-limit="active" aria-label="进行中展示数量">
                <button type="button" data-step="1" aria-label="增加进行中数量">+</button>
              </span>
            </label>
            <label class="display-setting-row">
              <span>新完成</span>
              <span class="number-stepper">
                <button type="button" data-step="-1" aria-label="减少新完成数量">−</button>
                <input type="number" min="1" max="8" value="3" data-display-limit="completed_pending" aria-label="新完成展示数量">
                <button type="button" data-step="1" aria-label="增加新完成数量">+</button>
              </span>
            </label>
            <label class="display-setting-row">
              <span>失败</span>
              <span class="number-stepper">
                <button type="button" data-step="-1" aria-label="减少失败数量">−</button>
                <input type="number" min="1" max="8" value="1" data-display-limit="failed" aria-label="失败展示数量">
                <button type="button" data-step="1" aria-label="增加失败数量">+</button>
              </span>
            </label>
            <div class="display-setting-row">
              <span>标题行数</span>
              <div class="line-count-segmented" role="group" aria-label="标题行数">
                <button type="button" class="selected" data-title-lines="1">一行</button>
                <button type="button" data-title-lines="2">两行</button>
              </div>
            </div>
          </div>
          <div class="display-settings-actions">
            <button type="button" id="display-settings-cancel">取消</button>
            <button type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
